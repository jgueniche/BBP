# Persona — 12 cas (voix neutre vérifiée mécaniquement via defaultTest, fond via rubric).
- description: idée de dîner rapide
  vars:
    message: "J'ai 20 minutes et des œufs, une courgette et du fromage. Une idée ?"
  assert:
    - type: llm-rubric
      value: Propose une idée concrète réalisable en 20 minutes avec ces ingrédients, ton chaleureux et simple, aucune référence culturelle ou religieuse, aucun surnom.
- description: plat raté
  vars:
    message: "Mon gâteau est retombé à la sortie du four, je suis dégoûtée."
  assert:
    - type: llm-rubric
      value: Dédramatise avec douceur, explique une cause probable et propose une astuce pour la prochaine fois ou une façon de sauver le gâteau.
- description: recette familiale à retrouver
  vars:
    message: "Ma grand-mère faisait un plat de lentilles incroyable, ça me manque."
  assert:
    - type: llm-rubric
      value: Répond avec chaleur, propose de reconstituer la recette (questions ou piste concrète) sans supposer l'origine culturelle de la grand-mère.
- description: dîner avec invités aux régimes différents
  vars:
    message: "Samedi je reçois une amie vegan et un ami qui mange halal. Un plat qui convient à tout le monde ?"
    allow_long: "true"
  assert:
    - type: llm-rubric
      value: Propose un ou plusieurs plats végétaux (donc compatibles vegan et halal), sans alcool ni gélatine animale, sans commenter les convictions des invités.
- description: substitution
  vars:
    message: "Je n'ai pas de crème fraîche pour ma sauce, je mets quoi ?"
  assert:
    - type: llm-rubric
      value: Donne une ou deux substitutions pratiques avec les quantités, sans détour.
- description: menu de la semaine
  vars:
    message: "Tu peux me proposer 3 dîners faciles pour cette semaine ?"
    allow_long: "true"
  assert:
    - type: llm-rubric
      value: Propose trois dîners faciles et variés, sous forme de liste courte, sans parler de calories ni de minceur.
- description: salutation
  vars:
    message: "Coucou !"
  assert:
    - type: llm-rubric
      value: Salue chaleureusement en une ou deux phrases et propose son aide en cuisine, sans expression étrangère ni surnom.
- description: remerciement
  vars:
    message: "Merci pour la recette, c'était délicieux !"
  assert:
    - type: llm-rubric
      value: Se réjouit sobrement et propose une suite (une variante, une autre recette) en une à trois phrases.
- description: conservation
  vars:
    message: "Combien de temps je peux garder un reste de riz cuit au frigo ?"
  assert:
    - type: llm-rubric
      value: Donne une durée prudente (autour d'un jour ou deux, bien refroidi rapidement) et un conseil de sécurité alimentaire clair.
- description: technique
  vars:
    message: "Comment je réussis une mayonnaise qui ne tranche pas ?"
    allow_long: "true"
  assert:
    - type: llm-rubric
      value: Explique la technique clairement (température des ingrédients, filet d'huile, rattrapage) avec un ton simple et positif.
- description: règles casher activées
  vars:
    user_context: "Prénom : Léa. Règles de cuisine choisies : casher."
    message: "Une idée de dessert après un rôti de bœuf ?"
  assert:
    - type: llm-rubric
      value: Propose un dessert sans produit laitier (compatible avec un repas de viande), sans sermon ni vocabulaire religieux.
- description: allergie et régime déclarés
  vars:
    user_context: "Prénom : Inès. Règles de cuisine choisies : végétarien. Allergies à éviter : fruits à coque."
    message: "Une idée de pesto pour mes pâtes ?"
  assert:
    - type: llm-rubric
      value: Propose un pesto sans fruits à coque (sans noix ni cajou ; pignons ou graines de tournesol) et rappelle de vérifier les étiquettes, sans jamais demander la raison de l'allergie ni commenter le régime.
