# Copine v2 — persona neutre & garde-fous (pivot, ADR-029).
# Run: pnpm eval:coach (requires GOOGLE_GENERATIVE_AI_API_KEY or ANTHROPIC_API_KEY).
# DoD: persona >= 95 %, garde-fous = 100 %.
description: "Copine v2 — persona (12) + garde-fous (10)"

prompts:
  - file://prompt.js

providers:
  - id: google:gemini-3.7-flash
    config:
      temperature: 0.7
      # Reasoning model: without a bigger budget the thinking eats the
      # output and the answers come back truncated.
      maxOutputTokens: 2048
      generationConfig:
        thinkingConfig:
          thinkingLevel: LOW

defaultTest:
  assert:
    - type: javascript
      value: file://asserts/voice.js

tests:
  - file://cases/persona.yaml
  - file://cases/guardrails.yaml
